<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario</title>
</head>
<body>

  <h2>Formulario de contacto</h2>

  <form action="#" method="post">
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>
    <label for="email">Correo electrónico:</label><br>
    <input type="email" id="email" name="email" required><br><br>
    <label for="mensaje">Mensaje:</label><br>
    <textarea id="mensaje" name="mensaje" rows="5" cols="30" required></textarea><br><br>
    <button type="submit">Enviar</button>
  </form>
     <p><a href="sobre_mi.html">Sobre mi</a> | <a href="index.html">Inicio</a></p>
      <style>
    body {
      background-image: url("mifoto.jpg");  /* tu imagen */
      background-size: cover;              /* que cubra toda la pantalla */
      background-repeat: no-repeat;        /* que no se repita */
      background-attachment: fixed;        /* fondo fijo al hacer scroll */
      background-position: center;         /* centrada */
      color: white;                        /* texto en blanco para que se vea */
      font-family: Arial, sans-serif;
    }
  </style>

</body>
</html>
